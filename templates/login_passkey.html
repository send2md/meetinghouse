{% extends "base.html" %}
{% block title %}Passkey — Meetinghouse{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:2rem auto;">
  <h1>{{ username }}</h1>
  <p>Log in with your passkey: your device will ask for your face, fingerprint, or PIN.</p>
  <p><button type="button" data-passkey="login"
             data-options="{{ url_for('LoginPasskeyOptions') }}"
             data-verify="{{ url_for('LoginPasskeyVerify') }}"
             data-status="passkey-status">Log in with passkey</button></p>
  <p id="passkey-status" class="muted" role="status"></p>
  <p class="muted"><a href="{{ url_for('LoginRecover') }}">Lost your device?</a></p>
  <p class="muted">Not {{ username }}? <a href="{{ url_for('Login') }}">Start again</a>.</p>
</div>
<script src="{{ url_for('static', filename='passkeys.js') }}"></script>
{% endblock %}
