{% extends "base.html" %}
{% block title %}Login taken — Meetinghouse{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:2rem auto;">
  <h1>"{{ taken_username }}" is taken</h1>
  <p class="muted">How about this instead? You can also type your own.</p>
  <form method="post" action="{{ url_for('RegisterStart') }}">
    <label>New login</label>
    <input type="text" name="username" value="{{ suggestion }}" required autofocus>
    <p><input type="submit" value="Continue"></p>
  </form>
</div>
{% endblock %}
