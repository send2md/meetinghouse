{% extends "base.html" %}
{% block title %}Password — Meetinghouse{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:2rem auto;">
  <h1>{{ username }}</h1>
  <form method="post" action="{{ url_for('LoginPassword') }}">
    <label>Password</label>
    <input type="password" name="password" required autofocus>
    <p><input type="submit" value="Log in"></p>
  </form>
  <p class="muted">Got a letter from us with a code? <a href="{{ url_for('LoginCode') }}">Use the code from your letter</a>.</p>
</div>
{% endblock %}
